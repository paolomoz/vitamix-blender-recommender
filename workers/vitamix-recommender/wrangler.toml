name = "vitamix-recommender"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "development"

# Cloudflare Workers AI binding for embeddings (free!)
[ai]
binding = "AI"

# Cloudflare Vectorize binding for persistent vector storage
[[vectorize]]
binding = "VECTORIZE"
index_name = "vitamix-products"

# Secrets (set via wrangler secret put):
# - CEREBRAS_KEY
# - ANTHROPIC_API_KEY
# - OPENAI_API_KEY (optional fallback for RAG embeddings)
# - FAL_API_KEY
# - DA_IMS_TOKEN
